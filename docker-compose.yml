services:
  postgres:
    image: postgres:17-alpine
    container_name: backend_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backend_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Only used during `prisma generate` — not the real runtime URL
        DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    container_name: backend_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-backend_db}?schema=public"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET}
      TELEGRAM_REDIRECT_URI: ${TELEGRAM_REDIRECT_URI}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-servicehub_bot}
      TELEGRAM_OIDC_COOKIE_SECRET: ${TELEGRAM_OIDC_COOKIE_SECRET}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-cloudinary://key:secret@cloud}
      CHAPA_PUBLIC_KEY: ${CHAPA_PUBLIC_KEY:-CHAPUBK-test-placeholder}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-CHASECK_TEST-placeholder}
      CHAPA_ENCRYPTION_KEY: ${CHAPA_ENCRYPTION_KEY:-placeholder-encryption-key-32chars}
      CHAPA_RETURN_URL: ${CHAPA_RETURN_URL:-http://localhost:3000/payment/verify}
      CHAPA_CALLBACK_URL: ${CHAPA_CALLBACK_URL:-http://localhost:5000/api/v1/payment/webhook}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backend_net:
    driver: bridge

volumes:
  postgres_data:
